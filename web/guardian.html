<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guardian Console</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>🛡️ Guardian console</h1>
    <p class="lead" id="who">Loading…</p>
    <div id="banner" class="stack"></div>
    <div class="grid" style="margin-top:16px">
      <div class="card stack"><h2>Payments waiting for you</h2><div id="pending"></div></div>
      <div class="card stack"><h2>Protection changes</h2><div id="settings"></div>
        <h2 style="margin-top:12px">Account</h2><div class="row" id="acct"></div></div>
    </div>
    <div class="card stack" style="margin-top:16px"><h2>Alerts</h2><div id="alerts" class="small"></div></div>
  </main>
  <script type="module">
    import { $, esc, api, money, ago, until, hubNav } from '/common.js';
    hubNav('');
    const g = new URLSearchParams(location.search).get('g');
    const base = `/api/vault/guardian/${encodeURIComponent(g)}`;
    let s;
    const post = async (path, body) => { s = await api(base + path, { method: 'POST', body }); render(); };

    function render() {
      const clock = s.clock;
      $('#who').textContent = `Signed in as ${s.guardian.name}. You co-sign risky payments for this account. Any one guardian can veto.`;
      $('#banner').innerHTML = (s.duressActive ? `<div class="notice bad">🚨 <b>DURESS PIN USED.</b> The account owner may be under coercion right now. Call them on a known number or contact police. ${money(s.freezeVault)} is safely parked in the freeze vault. Closing the episode needs ${s.required} guardians (${s.clearVotes} so far). <button id="clear">Vote to close the episode &amp; return the money</button></div>` : '')
        + (s.frozen ? '<div class="notice bad">🧊 Account is frozen.</div>' : '');
      $('#pending').innerHTML = s.pending.length ? s.pending.map((t) => `
        <div style="padding:8px 0;border-bottom:1px solid var(--line)">
          <div><b>${money(t.amount)}</b> → ${esc(t.payeeName)} <span class="muted small">${ago(t.createdAt, clock)} · releases in ${until(t.releaseAt, clock)} · ${t.approvals}/${t.required} approvals</span></div>
          <ul class="small muted">${t.risk.reasons.map((r) => `<li>${esc(r)}</li>`).join('')}</ul>
          ${t.quiz ? `<div class="small">Check-in answers: ${s.quiz.map((q) => `<div>${t.quiz.answers[q.id] === 'yes' ? '🔴 YES' : '⚪ no'} · ${esc(q.q)}</div>`).join('')}</div>` : '<div class="small muted">Owner hasn\'t done the check-in yet.</div>'}
          <div class="row" style="margin-top:6px">${t.approvedByMe ? '<span class="chip ok">You approved</span>' : `<button class="primary" data-approve="${t.id}">Approve</button>`}<button class="danger" data-veto="${t.id}">Veto</button></div>
        </div>`).join('') : '<p class="muted small">Nothing waiting.</p>';
      $('#settings').innerHTML = s.pendingSettings.length ? s.pendingSettings.map((p) => `<div class="small">⏳ <b>${esc(p.key)}</b>: ${p.from} → ${p.to} (in ${until(p.effectiveAt, clock)}) <button data-vetoset="${p.id}">Veto</button></div>`).join('') : '<p class="muted small">No pending changes.</p>';
      $('#acct').innerHTML = `<button data-freeze="${s.frozen ? '0' : '1'}" class="${s.frozen ? '' : 'danger'}">${s.frozen ? 'Unfreeze account' : '🧊 Freeze account'}</button>`;
      $('#alerts').innerHTML = s.alerts.map((a) => `<div>• <span class="muted">${ago(a.at, clock)}</span> ${esc(a.text)}</div>`).join('') || '<span class="muted">None.</span>';
    }

    document.addEventListener('click', async (e) => {
      const b = e.target.closest('button'); if (!b) return;
      try {
        if (b.id === 'clear') await post('/clear-duress');
        else if (b.dataset.approve) await post('/decide', { txId: b.dataset.approve, decision: 'approve' });
        else if (b.dataset.veto) await post('/decide', { txId: b.dataset.veto, decision: 'veto' });
        else if (b.dataset.vetoset) await post('/veto-setting', { id: b.dataset.vetoset });
        else if (b.dataset.freeze) await post('/freeze', { frozen: b.dataset.freeze === '1' });
      } catch (err) { alert(err.message); }
    });

    async function load() { try { s = await api(base); render(); } catch (e) { $('#who').textContent = '⚠️ ' + e.message; } }
    load(); setInterval(load, 4000);
  </script>
</body>
</html>
