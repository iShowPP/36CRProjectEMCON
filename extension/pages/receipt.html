<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EMCON evidence receipt</title>
  <link rel="stylesheet" href="pages.css">
  <style>
    body { padding: 32px 16px 56px; }
    .doc { max-width: 760px; margin: 0 auto; background: var(--sheet); border: 1px solid var(--rule); border-top: 6px solid var(--ink); padding: 28px 32px; }
    .doc.danger { border-top-color: var(--bad); } .doc.caution { border-top-color: var(--warn); }
    dl { display: grid; grid-template-columns: 150px 1fr; gap: 6px 14px; margin: 14px 0 18px; font-size: 13px; }
    dt { font: 600 10.5px/1.9 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    dd { margin: 0; overflow-wrap: anywhere; }
    h2 { margin-top: 20px; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
    @media (max-width: 560px) { .doc { padding: 20px 18px; } dl { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <article class="doc" id="doc">
    <div class="kicker">EMCON · evidence receipt</div>
    <h1 id="title">Building receipt…</h1>
    <div id="body"><p class="muted">Signing with your EMCON key and requesting an independent timestamp.</p></div>
  </article>
  <script type="module" src="receipt.js"></script>
</body>
</html>
