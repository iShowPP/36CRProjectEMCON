<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EMCON Evidence Receipt</title>
  <link rel="stylesheet" href="pages.css">
  <style>
    body { padding: 28px 16px 64px; font-size: 15px; }
    .wrap { max-width: 760px; margin: 0 auto; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    .brand img { width: 28px; height: 28px; } .brand b { font-size: 17px; letter-spacing: .02em; } .brand span { color: var(--text-2); }
    .panel .hero h1 { font-size: 28px; }
    .proof { margin-top: 14px; }
    .proof .line { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .proof .line:last-child { border-bottom: 0; }
    .proof .line .ic { margin-top: 2px; }
    .proof .line b { display: block; }
    .proof .line span { color: var(--text-2); font-size: 14px; overflow-wrap: anywhere; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
    .note { margin-top: 16px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><img src="../icons/icon48.png" alt=""><b>EMCON</b><span>· Signed evidence receipt</span></div>
    <article id="doc">
      <h1 id="title" style="font-size:24px">Building your receipt…</h1>
      <div id="body"><p class="muted" style="margin-top:6px">Signing with your EMCON key and asking the server for an independent timestamp.</p></div>
    </article>
  </div>
  <script type="module" src="receipt.js"></script>
</body>
</html>
