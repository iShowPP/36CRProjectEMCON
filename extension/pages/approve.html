<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>EMCON Ghost — sign-in request</title>
  <link rel="stylesheet" href="pages.css">
  <style> body { padding: 18px; } .site { font-size: 18px; font-weight: 800; word-break: break-all; } li { margin: 4px 0; } </style>
</head>
<body>
  <h1>👻 Sign-in request</h1>
  <p class="site" id="origin"></p>
  <div class="card">
    <h2>This site will learn</h2>
    <ul id="shares" class="small"></ul>
    <h2>It will NOT learn</h2>
    <ul class="small muted"><li>Your name, email, phone or birthdate</li><li>Any ID that other sites also see</li><li>Who verified you, or when</li></ul>
  </div>
  <div id="pinBox" class="hidden"><label for="pin">Your Ghost PIN</label><input id="pin" type="password" inputmode="numeric" autofocus></div>
  <div class="row" style="margin-top:12px">
    <button id="ok" class="primary">Approve</button>
    <button id="no">Decline</button>
  </div>
  <div id="msg" class="small" style="margin-top:8px"></div>
  <script type="module" src="approve.js"></script>
</body>
</html>
