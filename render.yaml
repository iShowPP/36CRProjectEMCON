# One-click deploy: https://render.com/deploy?repo=https://github.com/iShowPP/36CRProjectEMCON
# Free plan. Render gives the service a public https URL (RENDER_EXTERNAL_URL), which the
# server uses as its official address. EMCON_SECRET is generated once by Render and every
# server key is derived from it, so keys survive the free tier's restarts.
services:
  - type: web
    name: emcon
    runtime: node
    plan: free
    buildCommand: "true"
    startCommand: node server/index.js
    healthCheckPath: /api/wot/groups
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EMCON_SECRET
        generateValue: true
